<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Oficina - Abogado Miguel Angel Ramirez Mogollon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            color: #fff;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #0a0a0a;
            border-radius: 28px;
            padding: 20px;
            border: 1px solid #D4AF37;
            box-shadow: 0 10px 40px rgba(212, 175, 55, 0.1);
        }
        
        h1 {
            color: #D4AF37;
            text-align: center;
            font-size: 22px;
            margin-bottom: 5px;
            font-family: 'Georgia', serif;
        }
        
        .subtitulo {
            text-align: center;
            font-size: 11px;
            color: #888;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }
        
        .nav {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .nav-btn {
            flex: 1;
            background: #1a1a1a;
            color: #D4AF37;
            border: 1px solid #D4AF37;
            padding: 10px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .nav-btn:hover {
            background: #D4AF37;
            color: #000;
        }
        
        .nav-btn.active {
            background: #D4AF37;
            color: #000;
        }
        
        .panel {
            display: none;
            animation: fadeIn 0.3s;
        }
        
        .panel.active {
            display: block;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .btn {
            background: #D4AF37;
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
            transition: all 0.3s;
        }
        
        .btn:hover {
            opacity: 0.85;
            transform: translateY(-2px);
        }
        
        .btn-danger {
            background: #ff4444;
            color: white;
        }
        
        .btn-secondary {
            background: #333;
            color: #D4AF37;
        }
        
        .input-group {
            margin-bottom: 15px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #D4AF37;
            font-size: 12px;
            font-weight: bold;
        }
        
        .input-group input, .input-group select, .input-group textarea {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #333;
            background: #1a1a1a;
            color: #fff;
            font-size: 14px;
        }
        
        .input-group input:focus, .input-group select:focus, .input-group textarea:focus {
            outline: none;
            border-color: #D4AF37;
        }
        
        /* Estilos para clientes */
        .cliente-item {
            background: #1a1a1a;
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid #D4AF37;
        }
        
        .cliente-info h3 {
            font-size: 14px;
            margin-bottom: 5px;
        }
        
        .cliente-info p {
            font-size: 11px;
            color: #888;
        }
        
        .delete-btn {
            background: #ff4444;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .rama-badge {
            background: #D4AF37;
            color: #000;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 10px;
            display: inline-block;
            margin-top: 5px;
            font-weight: bold;
        }
        
        /* Estilos para calendario */
        .calendario-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .calendario-header h3 {
            color: #D4AF37;
            font-size: 18px;
        }
        
        .calendario-header button {
            background: #1a1a1a;
            border: 1px solid #D4AF37;
            color: #D4AF37;
            padding: 8px 15px;
            border-radius: 10px;
            cursor: pointer;
        }
        
        .calendario-dias {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            margin-bottom: 10px;
        }
        
        .dia-nombre {
            text-align: center;
            font-weight: bold;
            padding: 8px;
            font-size: 12px;
            color: #D4AF37;
        }
        
        .calendario-fechas {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }
        
        .fecha {
            text-align: center;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 12px;
            background: #1a1a1a;
            transition: all 0.2s;
        }
        
        .fecha:hover {
            background: #D4AF37;
            color: #000;
            transform: scale(1.05);
        }
        
        .fecha.selected {
            background: #D4AF37;
            color: #000;
            font-weight: bold;
        }
        
        .fecha.has-event {
            border: 2px solid #D4AF37;
            font-weight: bold;
        }
        
        /* Estilos para eventos */
        .evento-item {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid #D4AF37;
        }
        
        .evento-info h4 {
            font-size: 14px;
            margin-bottom: 5px;
        }
        
        .evento-info p {
            font-size: 11px;
            color: #888;
        }
        
        .evento-fecha {
            font-size: 10px;
            color: #D4AF37;
            margin-top: 5px;
        }
        
        .delete-evento-btn {
            background: #ff4444;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 11px;
        }
        
        .status {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #1a1a1a;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 10px;
            color: #D4AF37;
            border: 1px solid #D4AF37;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: #0a0a0a;
            border-radius: 20px;
            padding: 25px;
            max-width: 90%;
            width: 350px;
            border: 1px solid #D4AF37;
        }
        
        .modal-content h3 {
            color: #D4AF37;
            margin-bottom: 15px;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        
        /* Scroll */
        ::-webkit-scrollbar {
            width: 5px;
        }
        
        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #D4AF37;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>⚖️ OFICINA</h1>
    <div class="subtitulo">ABOGADO MIGUEL ANGEL RAMIREZ MOGOLLON</div>
    
    <div class="nav">
        <button class="nav-btn" onclick="mostrarPanel('clientes', this)">📋 Clientes</button>
        <button class="nav-btn active" onclick="mostrarPanel('calendario', this)">📅 Calendario</button>
        <button class="nav-btn" onclick="mostrarPanel('estadisticas', this)">📊 Stats</button>
        <button class="nav-btn" onclick="mostrarPanel('ia', this)">🤖 IA</button>
    </div>
    
    <!-- Panel Clientes -->
    <div id="panel-clientes" class="panel">
        <button class="btn" onclick="mostrarFormularioCliente()">➕ Nuevo Cliente</button>
        
        <div id="formularioCliente" style="display: none; margin-top: 15px;">
            <div class="input-group">
                <label>Tipo</label>
                <select id="tipoCliente">
                    <option value="natural">👤 Persona Natural</option>
                    <option value="empresa">🏢 Empresa</option>
                </select>
            </div>
            <div class="input-group">
                <label>Nombre *</label>
                <input type="text" id="nombreCliente" placeholder="Ej: Juan Pérez">
            </div>
            <div class="input-group">
                <label>Teléfono</label>
                <input type="text" id="telefonoCliente" placeholder="Ej: 3001234567">
            </div>
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="emailCliente" placeholder="correo@ejemplo.com">
            </div>
            <div class="input-group">
                <label>Rama</label>
                <select id="ramaCliente">
                    <option value="Civil">⚖️ Civil</option>
                    <option value="Laboral">👔 Laboral</option>
                    <option value="Datacrédito">📊 Datacrédito</option>
                </select>
            </div>
            <button class="btn" onclick="agregarCliente()">💾 Guardar</button>
            <button class="btn btn-secondary" onclick="cerrarFormularioCliente()">❌ Cancelar</button>
        </div>
        
        <div id="listaClientes"></div>
    </div>
    
    <!-- Panel Calendario (COMPLETO) -->
    <div id="panel-calendario" class="panel active">
        <div class="calendario-header">
            <button onclick="cambiarMes(-1)">◀</button>
            <h3 id="mesActual">Cargando...</h3>
            <button onclick="cambiarMes(1)">▶</button>
        </div>
        
        <div class="calendario-dias">
            <div class="dia-nombre">L</div>
            <div class="dia-nombre">M</div>
            <div class="dia-nombre">M</div>
            <div class="dia-nombre">J</div>
            <div class="dia-nombre">V</div>
            <div class="dia-nombre">S</div>
            <div class="dia-nombre">D</div>
        </div>
        
        <div id="calendarioFechas" class="calendario-fechas"></div>
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin: 15px 0 10px 0;">
            <h3 style="color: #D4AF37; font-size: 16px;">📋 Eventos del día</h3>
            <button class="btn" style="width: auto; padding: 8px 15px;" onclick="mostrarModalEvento()">➕ Agregar Evento</button>
        </div>
        
        <div id="listaEventos"></div>
    </div>
    
    <!-- Panel Estadísticas -->
    <div id="panel-estadisticas" class="panel">
        <div class="empty-state">
            📊 Estadísticas en desarrollo
            <br><br>
            Total clientes: <span id="totalClientes">0</span>
        </div>
    </div>
    
    <!-- Panel IA -->
    <div id="panel-ia" class="panel">
        <div class="input-group">
            <label>🤖 Asistente IA</label>
            <input type="text" id="iaInput" placeholder='Ej: "crea un cliente llamado Juan Pérez"' onkeypress="if(event.key==='Enter') enviarComando()">
        </div>
        <button class="btn" onclick="enviarComando()">🚀 Ejecutar Comando</button>
        
        <div id="iaRespuesta" style="margin-top: 15px; background: #1a1a1a; padding: 15px; border-radius: 12px; min-height: 100px;">
            🤖 Esperando tu comando...
        </div>
        
        <div style="margin-top: 15px;">
            <span class="rama-badge" onclick="ejemploComando('crea un cliente llamado Ana García, teléfono 3112223344, rama Laboral')">📝 Crear cliente</span>
            <span class="rama-badge" onclick="ejemploComando('muéstrame todos los clientes')">👥 Ver clientes</span>
            <span class="rama-badge" onclick="ejemploComando('cuántos clientes tengo')">📊 Estadísticas</span>
            <span class="rama-badge" onclick="ejemploComando('agenda una reunión para mañana a las 10am')">📅 Agenda evento</span>
        </div>
    </div>
</div>

<div class="status" id="status">✅ Listo</div>

<!-- Modal para agregar evento -->
<div id="modalEvento" class="modal">
    <div class="modal-content">
        <h3>📅 Agendar Evento</h3>
        <div class="input-group">
            <label>Título</label>
            <input type="text" id="eventoTitulo" placeholder="Ej: Audiencia con cliente">
        </div>
        <div class="input-group">
            <label>Descripción</label>
            <textarea id="eventoDescripcion" rows="2" placeholder="Detalles del evento..."></textarea>
        </div>
        <div class="input-group">
            <label>Hora</label>
            <input type="time" id="eventoHora" value="10:00">
        </div>
        <div class="input-group">
            <label>Recordatorio</label>
            <select id="eventoRecordatorio">
                <option value="0">Sin recordatorio</option>
                <option value="15">15 minutos antes</option>
                <option value="30">30 minutos antes</option>
                <option value="60">1 hora antes</option>
            </select>
        </div>
        <button class="btn" onclick="agregarEvento()">💾 Guardar Evento</button>
        <button class="btn btn-secondary" onclick="cerrarModalEvento()">❌ Cancelar</button>
    </div>
</div>

<script>
    // ========== DATOS ==========
    let clientes = [];
    let eventos = [];
    let fechaSeleccionada = new Date();
    let mesActual = new Date();
    
    // ========== CLIENTES ==========
    function cargarClientes() {
        const guardados = localStorage.getItem('abogado_clientes');
        if (guardados) {
            clientes = JSON.parse(guardados);
        }
        actualizarListaClientes();
        actualizarEstadisticas();
    }
    
    function guardarClientes() {
        localStorage.setItem('abogado_clientes', JSON.stringify(clientes));
        actualizarEstadisticas();
    }
    
    function agregarCliente() {
        const nombre = document.getElementById('nombreCliente').value.trim();
        if (!nombre) {
            mostrarToast('❌ Ingresa el nombre del cliente', '#ff8888');
            return;
        }
        
        const cliente = {
            id: Date.now(),
            tipo: document.getElementById('tipoCliente').value,
            nombre: nombre,
            telefono: document.getElementById('telefonoCliente').value,
            email: document.getElementById('emailCliente').value,
            rama: document.getElementById('ramaCliente').value,
            fecha: new Date().toLocaleDateString()
        };
        
        clientes.push(cliente);
        guardarClientes();
        actualizarListaClientes();
        cerrarFormularioCliente();
        mostrarToast('✅ Cliente creado: ' + nombre, '#88ff88');
    }
    
    function eliminarCliente(id) {
        if (confirm('¿Eliminar este cliente?')) {
            clientes = clientes.filter(c => c.id !== id);
            guardarClientes();
            actualizarListaClientes();
            mostrarToast('🗑️ Cliente eliminado', '#ffaa88');
        }
    }
    
    function actualizarListaClientes() {
        const container = document.getElementById('listaClientes');
        if (!container) return;
        
        if (clientes.length === 0) {
            container.innerHTML = '<div class="empty-state">📋 No hay clientes registrados</div>';
            return;
        }
        
        container.innerHTML = clientes.map(c => `
            <div class="cliente-item">
                <div class="cliente-info">
                    <h3>${c.tipo === 'empresa' ? '🏢' : '👤'} ${escapeHtml(c.nombre)}</h3>
                    <p>📞 ${c.telefono || 'No registrado'} | ✉️ ${c.email || 'No registrado'}</p>
                    <span class="rama-badge">⚖️ ${c.rama}</span>
                </div>
                <button class="delete-btn" onclick="eliminarCliente(${c.id})">🗑️</button>
            </div>
        `).join('');
    }
    
    // ========== CALENDARIO Y EVENTOS ==========
    function cargarEventos() {
        const guardados = localStorage.getItem('abogado_eventos');
        if (guardados) {
            eventos = JSON.parse(guardados);
        }
        actualizarCalendario();
    }
    
    function guardarEventos() {
        localStorage.setItem('abogado_eventos', JSON.stringify(eventos));
    }
    
    function actualizarCalendario() {
        const year = mesActual.getFullYear();
        const month = mesActual.getMonth();
        const meses = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
        document.getElementById('mesActual').textContent = `${meses[month]} ${year}`;
        
        const primerDia = new Date(year, month, 1);
        const ultimoDia = new Date(year, month + 1, 0);
        let inicioSemana = primerDia.getDay();
        inicioSemana = inicioSemana === 0 ? 7 : inicioSemana;
        
        let html = '';
        for (let i = 1; i < inicioSemana; i++) {
            html += '<div class="fecha"></div>';
        }
        
        for (let dia = 1; dia <= ultimoDia.getDate(); dia++) {
            const fecha = new Date(year, month, dia);
            const esSeleccionada = fecha.toDateString() === fechaSeleccionada.toDateString();
            const tieneEventos = eventos.some(e => e && e.fecha && new Date(e.fecha).toDateString() === fecha.toDateString());
            let clase = '';
            if (esSeleccionada) clase = 'selected';
            if (tieneEventos && !esSeleccionada) clase = 'has-event';
            html += `<div class="fecha ${clase}" onclick="seleccionarFecha(${year}, ${month}, ${dia})">${dia}</div>`;
        }
        
        document.getElementById('calendarioFechas').innerHTML = html;
        actualizarEventosDelDia();
    }
    
    function actualizarEventosDelDia() {
        const eventosDelDia = eventos.filter(e => e && e.fecha && new Date(e.fecha).toDateString() === fechaSeleccionada.toDateString());
        const container = document.getElementById('listaEventos');
        
        if (eventosDelDia.length === 0) {
            container.innerHTML = '<div class="empty-state">📅 No hay eventos para este día</div>';
            return;
        }
        
        container.innerHTML = eventosDelDia.map(e => `
            <div class="evento-item">
                <div class="evento-info">
                    <h4>📌 ${escapeHtml(e.titulo)}</h4>
                    <p>${escapeHtml(e.descripcion || 'Sin descripción')}</p>
                    <div class="evento-fecha">⏰ ${e.hora}</div>
                </div>
                <button class="delete-evento-btn" onclick="eliminarEvento(${e.id})">🗑️</button>
            </div>
        `).join('');
    }
    
    function seleccionarFecha(year, month, day) {
        fechaSeleccionada = new Date(year, month, day);
        actualizarCalendario();
    }
    
    function cambiarMes(delta) {
        mesActual.setMonth(mesActual.getMonth() + delta);
        actualizarCalendario();
    }
    
    function mostrarModalEvento() {
        document.getElementById('modalEvento').classList.add('active');
    }
    
    function cerrarModalEvento() {
        document.getElementById('modalEvento').classList.remove('active');
        document.getElementById('eventoTitulo').value = '';
        document.getElementById('eventoDescripcion').value = '';
        document.getElementById('eventoHora').value = '10:00';
    }
    
    function agregarEvento() {
        const titulo = document.getElementById('eventoTitulo').value.trim();
        if (!titulo) {
            mostrarToast('❌ Ingresa un título para el evento', '#ff8888');
            return;
        }
        
        const evento = {
            id: Date.now(),
            titulo: titulo,
            descripcion: document.getElementById('eventoDescripcion').value,
            hora: document.getElementById('eventoHora').value,
            recordatorio: parseInt(document.getElementById('eventoRecordatorio').value),
            fecha: fechaSeleccionada.toISOString()
        };
        
        eventos.push(evento);
        guardarEventos();
        cerrarModalEvento();
        actualizarCalendario();
        mostrarToast('✅ Evento agendado para ' + fechaSeleccionada.toLocaleDateString(), '#88ff88');
        
        if (evento.recordatorio > 0) {
            setTimeout(() => {
                mostrarToast('🔔 Recordatorio: ' + evento.titulo, '#D4AF37');
            }, evento.recordatorio * 60000);
        }
    }
    
    function eliminarEvento(id) {
        if (confirm('¿Eliminar este evento?')) {
            eventos = eventos.filter(e => e.id !== id);
            guardarEventos();
            actualizarCalendario();
            mostrarToast('🗑️ Evento eliminado', '#ffaa88');
        }
    }
    
    // ========== ESTADÍSTICAS ==========
    function actualizarEstadisticas() {
        const totalElement = document.getElementById('totalClientes');
        if (totalElement) {
            totalElement.textContent = clientes.length;
        }
    }
    
    // ========== IA ==========
    function enviarComando() {
        const input = document.getElementById('iaInput');
        const comando = input.value.trim();
        
        if (!comando) {
            mostrarRespuestaIA('❌ Escribe un comando válido', '#ff8888');
            return;
        }
        
        mostrarRespuestaIA('🤔 Procesando: "' + comando + '"...', '#D4AF37');
        
        setTimeout(() => {
            let respuesta = procesarComando(comando);
            mostrarRespuestaIA(respuesta, '#88ff88');
        }, 300);
        
        input.value = '';
    }
    
    function procesarComando(comando) {
        const cmd = comando.toLowerCase();
        
        // Crear cliente
        if (cmd.includes('crea') && cmd.includes('cliente')) {
            let nombre = '';
            const nombreMatch = comando.match(/cliente\s+llamado\s+([^,\.]+)/i) || comando.match(/cliente\s+([^,\.]+)/i);
            if (nombreMatch) nombre = nombreMatch[1].trim();
            
            if (!nombre) return '❌ No pude identificar el nombre. Ejemplo: "crea un cliente llamado Juan Pérez"';
            
            let telefono = '';
            const telMatch = comando.match(/tel[eé]fono\s+(\d+)/i);
            if (telMatch) telefono = telMatch[1];
            
            let rama = 'Civil';
            if (cmd.includes('laboral')) rama = 'Laboral';
            if (cmd.includes('datacrédito') || cmd.includes('datacredito')) rama = 'Datacrédito';
            
            const cliente = {
                id: Date.now(),
                tipo: 'natural',
                nombre: nombre.charAt(0).toUpperCase() + nombre.slice(1),
                telefono: telefono,
                email: '',
                rama: rama,
                fecha: new Date().toLocaleDateString()
            };
            
            clientes.push(cliente);
            guardarClientes();
            actualizarListaClientes();
            
            return `✅ Cliente creado exitosamente!\n\n📋 ${cliente.nombre}\n📞 ${telefono || 'No registrado'}\n⚖️ ${rama}`;
        }
        
        // Ver clientes
        if (cmd.includes('muestra') || cmd.includes('ver') || cmd.includes('lista')) {
            if (clientes.length === 0) return '📋 No hay clientes registrados. Usa "crea un cliente llamado..." para agregar uno.';
            
            let respuesta = `👥 **Tus clientes (${clientes.length}):**\n\n`;
            clientes.slice(0, 10).forEach((c, i) => {
                respuesta += `${i+1}. ${c.nombre} ⚖️ ${c.rama}\n`;
            });
            return respuesta;
        }
        
        // Agenda evento
        if (cmd.includes('agenda') || (cmd.includes('evento') && cmd.includes('recordatorio'))) {
            let titulo = 'Evento importante';
            const tituloMatch = comando.match(/(?:agenda|recordatorio)\s+(?:un|una)?\s+([^.]+?)(?:para|mañana|hoy|$)/i);
            if (tituloMatch && tituloMatch[1].length < 50) titulo = tituloMatch[1].trim();
            
            let fechaEvento = new Date();
            fechaEvento.setDate(fechaEvento.getDate() + 1);
            
            let hora = '10:00';
            const horaMatch = comando.match(/(\d{1,2})\s*(?::|horas?)?\s*(\d{2})?\s*(am|pm)?/i);
            if (horaMatch) {
                let h = parseInt(horaMatch[1]);
                if (h < 24) hora = `${h.toString().padStart(2, '0')}:00`;
            }
            
            const evento = {
                id: Date.now(),
                titulo: titulo,
                descripcion: 'Creado por IA',
                hora: hora,
                recordatorio: 15,
                fecha: fechaEvento.toISOString()
            };
            
            eventos.push(evento);
            guardarEventos();
            actualizarCalendario();
            
            return `✅ Evento agendado por IA!\n\n📌 ${titulo}\n📅 ${fechaEvento.toLocaleDateString()}\n⏰ ${hora}`;
        }
        
        // Eliminar cliente por IA
        if (cmd.includes('elimina') && cmd.includes('cliente')) {
            if (clientes.length === 0) return '❌ No hay clientes para eliminar';
            let ultimoCliente = clientes[clientes.length - 1];
            clientes = clientes.filter(c => c.id !== ultimoCliente.id);
            guardarClientes();
            actualizarListaClientes();
            return `🗑️ Cliente eliminado: ${ultimoCliente.nombre}`;
        }
        
        // Estadísticas
        if (cmd.includes('cuántos') || cmd.includes('estadísticas')) {
            const civil = clientes.filter(c => c.rama === 'Civil').length;
            const laboral = clientes.filter(c => c.rama === 'Laboral').length;
            const datacredito = clientes.filter(c => c.rama === 'Datacrédito').length;
            const eventosHoy = eventos.filter(e => new Date(e.fecha).toDateString() === new Date().toDateString()).length;
            
            return `📊 **Estadísticas**\n\n👥 Clientes: ${clientes.length}\n⚖️ Civil: ${civil}\n👔 Laboral: ${laboral}\n📊 Datacrédito: ${datacredito}\n\n📅 Eventos hoy: ${eventosHoy}\n📋 Total eventos: ${eventos.length}`;
        }
        
        return `🤖 **Comandos disponibles:**\n\n📝 "Crea un cliente llamado Juan Pérez, teléfono 3001234567, rama Civil"\n👥 "Muéstrame todos los clientes"\n📅 "Agenda una reunión para mañana a las 10am"\n🗑️ "Elimina el último cliente"\n📊 "Cuántos clientes tengo"`;
    }
    
    function mostrarRespuestaIA(texto, color) {
        const container = document.getElementById('iaRespuesta');
        container.innerHTML = `<div style="color: ${color}; white-space: pre-line;">${texto}</div>`;
        document.getElementById('status').innerHTML = '✅ Comando ejecutado';
        setTimeout(() => {
            document.getElementById('status').innerHTML = '✅ Listo';
        }, 2000);
    }
    
    function ejemploComando(comando) {
        document.getElementById('iaInput').value = comando;
        enviarComando();
    }
    
    function mostrarToast(mensaje, color) {
        const status = document.getElementById('status');
        status.innerHTML = mensaje;
        status.style.background = color;
        setTimeout(() => {
            status.innerHTML = '✅ Listo';
            status.style.background = '#1a1a1a';
        }, 2500);
    }
    
    // ========== UI HELPERS ==========
    function mostrarPanel(panel, btn) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.getElementById('panel-' + panel).classList.add('active');
        
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        if (btn) btn.classList.add('active');
        
        if (panel === 'calendario') actualizarCalendario();
        if (panel === 'estadisticas') actualizarEstadisticas();
    }
    
    function mostrarFormularioCliente() {
        document.getElementById('formularioCliente').style.display = 'block';
    }
    
    function cerrarFormularioCliente() {
        document.getElementById('formularioCliente').style.display = 'none';
        document.getElementById('nombreCliente').value = '';
        document.getElementById('telefonoCliente').value = '';
        document.getElementById('emailCliente').value = '';
    }
    
    function escapeHtml(text) {
        if (!text) return '';
        return text.replace(/[&<>]/g, function(m) {
            return m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;';
        });
    }
    
    // Cerrar modal al hacer clic fuera
    window.onclick = function(event) {
        const modal = document.getElementById('modalEvento');
        if (event.target === modal) {
            modal.classList.remove('active');
        }
    }
    
    // Inicializar
    cargarClientes();
    cargarEventos();
</script>
